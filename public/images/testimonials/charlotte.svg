<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Placeholder poster for Charlotte">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7B4DF"/>
      <stop offset="100%" stop-color="#E2B09C"/>
    </linearGradient>
    <radialGradient id="coral" cx="18%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#E39C95"/>
      <stop offset="70%" stop-color="#E39C95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navy" cx="100%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#141A28"/>
      <stop offset="55%" stop-color="#141A28" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="540" height="960" fill="url(#base)"/>
  <rect width="540" height="960" fill="url(#coral)"/>
  <rect width="540" height="960" fill="url(#navy)"/>
  <ellipse cx="270" cy="430" rx="118" ry="150" fill="#FBFAF0" opacity="0.28"/>
  <rect width="540" height="960" filter="url(#grain)" opacity="0.28"/>
  <text x="28" y="860" fill="#101A26" font-family="sans-serif" font-size="18">Placeholder - swap for customer video</text>
</svg>
