<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Placeholder poster for Martyn">
  <defs>
    <linearGradient id="base" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#DFE3EE"/>
      <stop offset="100%" stop-color="#E2B09C"/>
    </linearGradient>
    <radialGradient id="lime" cx="88%" cy="82%" r="62%">
      <stop offset="0%" stop-color="#E6F03E"/>
      <stop offset="65%" stop-color="#E6F03E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navy" cx="0%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#101A26"/>
      <stop offset="60%" stop-color="#101A26" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="540" height="960" fill="url(#base)"/>
  <rect width="540" height="960" fill="url(#lime)"/>
  <rect width="540" height="960" fill="url(#navy)"/>
  <ellipse cx="250" cy="400" rx="130" ry="160" fill="#FBFAF0" opacity="0.3"/>
  <rect width="540" height="960" filter="url(#grain)" opacity="0.28"/>
  <text x="28" y="860" fill="#101A26" font-family="sans-serif" font-size="18">Placeholder - swap for customer video</text>
</svg>
