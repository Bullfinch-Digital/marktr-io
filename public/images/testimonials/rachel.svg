<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Placeholder poster for Rachel">
  <defs>
    <linearGradient id="base" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9B7DC"/>
      <stop offset="100%" stop-color="#FBFAF0"/>
    </linearGradient>
    <radialGradient id="lavender" cx="70%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#A9B7DC"/>
      <stop offset="70%" stop-color="#A9B7DC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="8%" cy="90%" r="58%">
      <stop offset="0%" stop-color="#E39C95"/>
      <stop offset="68%" stop-color="#E39C95" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="540" height="960" fill="url(#base)"/>
  <rect width="540" height="960" fill="url(#lavender)"/>
  <rect width="540" height="960" fill="url(#coral)"/>
  <ellipse cx="290" cy="440" rx="124" ry="156" fill="#101A26" opacity="0.12"/>
  <rect width="540" height="960" filter="url(#grain)" opacity="0.28"/>
  <text x="28" y="860" fill="#101A26" font-family="sans-serif" font-size="18">Placeholder - swap for customer video</text>
</svg>
